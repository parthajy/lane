[package]
name = "rat-mac"
version = "0.1.0"
description = "Lane: local-first memory of what you do on your computer, powered by Rabbit"
edition = "2021"

[lib]
name = "rat_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.10"
minisign-verify = "0.2"
hex = "0.4"
log = "0.4"
ureq = { version = "2", features = ["json"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
walkdir = "2"
chacha20poly1305 = "0.10"
argon2 = "0.5"
notify = "8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
arboard = { version = "3", default-features = false }
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics", "NSScreen", "NSApplication", "NSRunningApplication", "NSPanel", "NSEvent", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
