# lane.so — a folder of static files, plus four small functions.
# The Mac app talks to none of this.

[build]
  publish = "site"
  command = "echo 'the site is static'"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/download/mac"
  to = "/.netlify/functions/download"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/buy/:plan"
  to = "/.netlify/functions/buy"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Without this, typing "lane.so" makes the browser try http first, and
    # Chrome refuses a download whose redirect chain touches http at all,
    # even when every later hop is secure. This tells it never to try.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Every running Lane asks for this file to see whether there is a newer
# build. Serving it from a function counts the install that asked, and
# changes nothing about what leaves their Mac.
[[redirects]]
  from = "/updates/*"
  to = "/.netlify/functions/updates"
  status = 200
  force = true

[[redirects]]
  from = "/join"
  to = "/.netlify/functions/join"
  status = 200
  force = true
